name: Official law registry audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    paths:
      - 'fixtures/official_uploads/official_law_registry.json'
      - 'scripts/audit_official_law_registry.py'
      - 'tests/test_audit_official_law_registry.py'
      - '.github/workflows/official-law-registry-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate registry metadata (no downloads)
        run: python scripts/audit_official_law_registry.py
      - name: Run registry tests
        run: python -m unittest discover -s tests -p test_audit_official_law_registry.py -v
