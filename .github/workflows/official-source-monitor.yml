name: Official source metadata monitor

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches:
      - fix/recover-research-engine-20261112
    paths:
      - 'scripts/monitor_official_sources.py'
      - 'fixtures/official_source_candidates.json'
      - '.github/workflows/official-source-monitor.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check registry metadata without importing legal documents
        run: python scripts/monitor_official_sources.py --online --output official-source-report.json
      - name: Publish diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: official-source-metadata
          path: official-source-report.json
          retention-days: 14
