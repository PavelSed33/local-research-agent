name: Official publication candidate discovery

on:
  workflow_dispatch:
  push:
    branches:
      - fix/recover-research-engine-20261112
    paths:
      - 'scripts/discover_official_publications.py'
      - 'scripts/probe_official_legal_sources.py'
      - 'test_official_publication_discovery.py'
      - 'scripts/monitor_official_sources.py'
      - 'scripts/quarantine_official_publications.py'
      - 'test_official_publication_quarantine.py'
      - '.github/workflows/official-publication-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify discovery security and matching
        run: python -m unittest test_official_publication_discovery test_official_source_monitor test_official_publication_quarantine -v
      - name: Diagnose official legal portals without downloading documents
        run: python -m scripts.probe_official_legal_sources --output official-source-connectivity.json
      - name: Search 5 priority acts with 60-second discovery budget
        run: python -m scripts.discover_official_publications --limit 5 --days 1 --max-seconds 60 --output official-publication-candidates.json
      - name: Download up to 5 candidate publications into temporary quarantine
        run: python -m scripts.quarantine_official_publications --candidates official-publication-candidates.json --output legal-source-quarantine --limit 5
      - name: Store candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: official-publication-candidates
          path: |
            official-publication-candidates.json
            official-source-connectivity.json
          retention-days: 14
      - name: Store quarantine metadata only (no downloaded legal documents)
        uses: actions/upload-artifact@v4
        with:
          name: unverified-official-publication-manifest
          path: legal-source-quarantine/quarantine_manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove unverified legal text from runner
        if: always()
        run: rm -rf legal-source-quarantine
