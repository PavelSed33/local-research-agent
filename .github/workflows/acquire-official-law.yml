name: Acquire official legal publications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download officially identified implementing order into quarantine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-review
          python -m scripts.fetch_official_publication pd152-access-order-2025 0001202506300007 official-review
      - name: Upload unreviewed originals as restricted workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-publications-unreviewed
          path: official-review/
          retention-days: 7
          if-no-files-found: warn
