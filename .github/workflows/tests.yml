name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch full history for copyright inventory
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' && git fetch origin --tags
      - name: Audit historical legal document paths (review-only)
        run: python scripts/audit_git_history.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Block accidentally committed licensed documents
        run: python scripts/check_copyright_hygiene.py
      - name: Compile source
        run: python -m compileall -q .
      - name: Install PDF, OCR and DOCX test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus fonts-dejavu-core
          python -m pip install python-docx Pillow reportlab
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Synthetic evaluation (not legal acceptance)
        run: python evaluation.py
      - name: Saved response snapshot checks (synthetic examples, not legal acceptance)
        run: python scripts/evaluate_answers.py fixtures/response_quality_examples.json
      - name: Check local capture hashes and quote spans (not legal acceptance)
        run: python legal_evidence.py
      - name: Validate statutory corpus and research references (not legal acceptance)
        run: python scripts/validate_legal_data.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned court PDFs from a clean checkout
        run: |
          test -z "$(find fixtures/primary_sources -name '*.pdf' -print -quit)"
          test ! -e "$RUNNER_TEMP/primary-pdfs"
          python3 scripts/restore_primary_archive.py --output-dir "$RUNNER_TEMP/primary-pdfs"
          chmod a+rx "$RUNNER_TEMP/primary-pdfs"
          chmod a+r "$RUNNER_TEMP"/primary-pdfs/*.pdf
      - name: Build image
        run: |
          touch fixtures/legal_evidence/local-only-test.txt
          docker build -t legal-agent:test .
      - name: Replay all PDF pages and hashes using the image's PDF tools
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/primary-pdfs:/private-pdf:ro" \
            -v "$PWD/scripts/verify_primary_archive.py:/app/scripts/verify_primary_archive.py:ro" \
            -e PRIMARY_ARCHIVE_PDF_DIR=/private-pdf \
            legal-agent:test python scripts/verify_primary_archive.py --parse-pdfs
      - name: Initialize workspace volume
        run: |
          docker volume create legal-agent-ci
          admin_token=$(docker run --rm -v legal-agent-ci:/data legal-agent:test python scripts/manage_workspace.py init --db /data/workspace.db | jq -er '.token')
          echo "::add-mask::$admin_token"
          echo "API_TOKEN=$admin_token" >> "$GITHUB_ENV"
      - name: Start workspace API
        run: |
          docker run -d --name legal-agent-test -v legal-agent-ci:/data -p 127.0.0.1:18080:8080 \
            -v "$RUNNER_TEMP/primary-pdfs:/private-pdf:ro" -e PRIMARY_ARCHIVE_PDF_DIR=/private-pdf \
            -e WORKSPACE_DB=/data/workspace.db legal-agent:test
      - name: Verify image and HTTP workspace
        run: |
          docker exec legal-agent-test sh -ec 'test "$(id -u)" = 10001 && test ! -e /app/.env && test ! -d /app/fixtures/statutes && test ! -e /app/fixtures/legal_evidence/local-only-test.txt'
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          import urllib.request

          base = 'http://127.0.0.1:18080'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + '/health', timeout=2) as response:
                      assert json.load(response)['workspace_enabled'] is True
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)

          def call(path, payload=None):
              request = urllib.request.Request(base + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + os.environ['API_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          assert call('/workspace/me', {})['role'] == 'admin'
          manifest = json.loads(Path('fixtures/primary_sources/manifest.json').read_text())
          expected = {source['id']: source['original_sha256'] for source in manifest['sources']}
          archive = call('/workspace/sources/list', {})
          assert archive['complete'] and archive['missing_original_ids'] == []
          assert len(expected) == len(archive['sources']) == 7
          assert all(source['integrity_checked'] for source in archive['sources'])
          assert {source['id']: source['original_sha256'] for source in archive['sources']} == expected
          print('HTTP: all seven court PDFs match the archive manifest')

          supply = {'profile': 'business', 'contract_type': 'supply', 'demo': True,
                    'document': 'Поставщик передаёт покупателю партию оборудования по спецификации.',
                    'facts': {'both_businesses': True, 'goods_nonpersonal_purpose': True,
                              'mixed_contract': False, 'special_regime': False}}
          review = call('/review/legal', {**supply, 'as_of': '2026-11-28'})
          refs = review['supply_references']
          assert review['verified'] is False and refs['period_supported'] is False
          assert len(refs['sources']) == 2 and len(refs['articles']) == 130
          assert any(a['number'] == '506' and 'поставщик' in a['excerpt'].lower() for a in refs['articles'])
          earlier = call('/review/legal', {**supply, 'as_of': '2026-11-27'})
          assert 'supply_references' not in earlier
          print('HTTP: B2B supply review exposes 130 articles from the two sources at the capture date only or later')

          matter = call('/workspace/matters/create', {'title': 'Docker smoke'})['matter_id']
          assert call('/workspace/cases/report', {'matter_id': matter, 'case_number': 'А00-1/2025',
                                                  'as_of': '2025-01-01'})['report']['status'] == 'no_evidence'
          assert not call('/statutes/search', {'query': 'текст документа'})['results']
          capabilities = call('/documents/capabilities')
          assert all(capabilities['tools'].values()) and {'eng', 'rus'} <= set(capabilities['ocr_languages'])
          with urllib.request.urlopen(base + '/workspace', timeout=5) as response:
              assert response.headers.get_content_type() == 'text/html'
          PY
      - name: Demo acceptance suite
        run: python scripts/smoke.py --base-url http://127.0.0.1:18080
      - name: Container logs
        if: always()
        run: docker logs legal-agent-test
      - name: Stop container
        if: always()
        run: |
          docker rm -f legal-agent-test
          docker volume rm legal-agent-ci

