name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch full history for copyright inventory
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' && git fetch origin --tags
      - name: Audit historical legal document paths (review-only)
        run: python scripts/audit_git_history.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Block accidentally committed licensed documents
        run: python scripts/check_copyright_hygiene.py
      - name: Compile source
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Synthetic evaluation (not legal acceptance)
        run: python evaluation.py
      - name: Saved response snapshot checks (synthetic examples, not legal acceptance)
        run: python scripts/evaluate_answers.py fixtures/response_quality_examples.json
      - name: Check local capture hashes and quote spans (not legal acceptance)
        run: python legal_evidence.py
      - name: Validate statutory corpus and research references (not legal acceptance)
        run: python scripts/validate_legal_data.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t legal-agent:test .
      - name: Offline demo preflight inside image
        run: |
          docker run --rm legal-agent:test python -c "import tempfile; from pathlib import Path; from agent import run; d=Path(tempfile.mkdtemp()); report,journal=run('Тест',3,6,d,demo=True,as_of='2023-03-01',verbose=False); print(report.read_text(encoding='utf-8')[:400]); print(journal.read_text(encoding='utf-8')[:400])"
      - name: Start API
        run: docker run -d --name legal-agent-test -p 127.0.0.1:18080:8080 -e API_TOKEN=ci-smoke-token legal-agent:test
      - name: Verify health and demo research
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2) as response:
                      assert json.load(response)['status'] == 'ok'
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          request = urllib.request.Request(
              'http://127.0.0.1:18080/ask',
              data=json.dumps({'question': 'Тест', 'demo': True, 'as_of': '2023-03-01'}).encode(),
              headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ci-smoke-token'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f'POST /ask failed with HTTP {exc.code}: {exc.read(4096).decode("utf-8", errors="replace")}', flush=True)
              raise
          assert payload['demo'] is True
          assert payload['as_of'] == '2023-03-01'
          assert payload['answer']
          PY
      - name: Verify historical-date input validation
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          url = 'http://127.0.0.1:18080/ask'
          for invalid in ('2023-02-30', '2023/03/01', 20230301):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({'question': 'Тест', 'demo': True, 'as_of': invalid}).encode(),
                  headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ci-smoke-token'})
              try:
                  urllib.request.urlopen(request, timeout=10)
              except urllib.error.HTTPError as exc:
                  assert exc.code == 400, (invalid, exc.code)
                  continue
              raise AssertionError(f'Invalid as_of was accepted: {invalid!r}')
          PY
      - name: Demo acceptance suite
        env:
          API_TOKEN: ci-smoke-token
        run: python scripts/smoke.py --base-url http://127.0.0.1:18080
      - name: Container logs
        if: always()
        run: docker logs legal-agent-test
      - name: Stop container
        if: always()
        run: docker rm -f legal-agent-test

