name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copyright-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Block accidentally committed licensed documents
        run: python scripts/check_copyright_hygiene.py

  source-safety-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile security and readiness modules
        run: |
          python -m py_compile scripts/check_official_source.py scripts/release_readiness.py
          python -m py_compile tests/test_official_source_intake.py tests/test_release_readiness.py tests/test_statutory_source_hosts.py
      - name: Verify source intake and release safety independently of quarantined archives
        run: |
          python -m unittest discover -s tests -p "test_official_source_intake.py" -v
          python -m unittest discover -s tests -p "test_release_readiness.py" -v
          python -m unittest discover -s tests -p "test_statutory_source_hosts.py" -v

  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Fetch full history for copyright inventory
        run: |
          git fetch --unshallow origin || test "$(git rev-parse --is-shallow-repository)" = false
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Audit historical legal document paths (review-only)
        run: python scripts/audit_git_history.py
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q .
      - name: Diagnose legal source coverage (informational; never masks failures)
        run: python scripts/diagnose_release_sources.py
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Synthetic evaluation (not legal acceptance)
        if: success() || failure()
        run: python evaluation.py
      - name: Saved response snapshot checks (synthetic examples, not legal acceptance)
        if: success() || failure()
        run: python scripts/evaluate_answers.py fixtures/response_quality_examples.json
      - name: Check local capture hashes and quote spans (not legal acceptance)
        if: success() || failure()
        run: python legal_evidence.py
      - name: Validate statutory corpus and research references (not legal acceptance)
        if: success() || failure()
        run: python scripts/validate_legal_data.py

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t legal-agent:test .
      - name: Assert only approved configuration fixtures are packaged
        run: |
          docker run --rm --entrypoint python legal-agent:test -c "from pathlib import Path; root=Path('/app/fixtures'); approved={'legal_coverage.json','legal_workflows.json','legal_benchmarks.json','contract_rule_catalog.json'}; actual={p.name for p in root.iterdir()} if root.exists() else set(); assert actual <= approved, f'Unexpected fixtures in image: {actual-approved}'; assert not any(p.suffix.lower() in {'.pdf','.docx','.txt'} for p in root.rglob('*') if p.is_file()), 'Legal document source packaged'"
      - name: Start API
        run: docker run -d --name legal-agent-test -p 127.0.0.1:18080:8080 -e API_TOKEN=ci-smoke-token legal-agent:test
      - name: Verify health and demo research
        run: |
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2) as response:
                      assert json.load(response)['status'] == 'ok'
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          request = urllib.request.Request(
              'http://127.0.0.1:18080/ask',
              data=json.dumps({'question': 'Тест', 'demo': True, 'as_of': '2023-03-01'}).encode(),
              headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ci-smoke-token'})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          assert payload['demo'] is True
          assert payload['as_of'] == '2023-03-01'
          assert payload['answer']
          PY
      - name: Reject unauthenticated external API calls
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          request = urllib.request.Request(
              'http://127.0.0.1:18080/ask',
              data=json.dumps({'question': 'Unauthorized', 'demo': True}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          try:
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f'Expected 401, got {exc.code}'
          else:
              raise AssertionError('Unauthenticated request was accepted')
          PY
      - name: Demo acceptance suite
        env:
          API_TOKEN: ci-smoke-token
        run: python scripts/smoke.py --base-url http://127.0.0.1:18080
      - name: Container logs
        if: always()
        run: docker logs legal-agent-test
      - name: Stop container
        if: always()
        run: docker rm -f legal-agent-test

