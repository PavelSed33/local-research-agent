<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Юридическое рабочее пространство</title><style>body{font:16px system-ui;margin:2rem auto;max-width:800px;padding:0 1rem;background:#f8fafc;color:#182436}input,textarea,button{font:inherit;padding:.7rem;box-sizing:border-box;width:100%;margin:.4rem 0}button{background:#183e72;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:1rem;border:1px solid #ddd}label{display:block;margin-top:1rem}</style></head><body><h1>Юридическое рабочее пространство</h1><p>Доступ к материалам дела требует персонального токена. Демонстрационные ответы не являются юридическим заключением.</p><label>Токен доступа<input id="token" type="password" autocomplete="off"></label><button id="connect">Проверить доступ</button><label>Идентификатор дела<input id="matter"></label><label>Вопрос<textarea id="question" rows="4"></textarea></label><button id="ask">Найти фрагменты документов</button><pre id="output" role="status" aria-live="polite"></pre><script src="/workspace.js" defer></script></body></html>
